<script>
(function(){
  'use strict';
  // ── CONFIG (cambia solo queste per ogni app) ─────────────────────────────
  var MODE = 'email';                 // 'email' oppure 'pin'
  var APP  = 'Risorse & Depositi';
  // ── COSTANTI ECOSISTEMA (uguali per tutte) ───────────────────────────────
  var SB_URL  = 'https://xqbhujcnjvwbwzpwjujf.supabase.co';
  var SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxYmh1amNuanZ3Ynd6cHdqdWpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3MzM4ODUsImV4cCI6MjA5NzMwOTg4NX0.VstO3aII143jpPXjgKg0t3du-yc5rS9xs2hYko_2DRs';
  var PIN_EMAIL = 'giaquinto.giuseppe+campo@gmail.com';
  var LSK = 'sb81_sess';
  var RESET_URL = 'https://giaquintogiuseppe-bit.github.io/ottantunocento-gestionale/reset.html';
  var _fetch = window.fetch.bind(window);
  var STORE = (MODE === 'pin') ? window.sessionStorage : window.localStorage;

  // ── sessione ─────────────────────────────────────────────────────────────
  function getSess(){ try{ return JSON.parse(STORE.getItem(LSK)||'null'); }catch(e){ return null; } }
  function setSess(s){ try{ s ? STORE.setItem(LSK, JSON.stringify(s)) : STORE.removeItem(LSK); }catch(e){} }
  function valida(s){ return s && s.access_token && s.expires_at && (Date.now()/1000 < s.expires_at - 60); }
  function salva(j){ setSess({ access_token:j.access_token, refresh_token:j.refresh_token,
    expires_at: j.expires_at || (Math.floor(Date.now()/1000) + (j.expires_in||3600)) }); }

  // ── fetch patchato: inietta il token utente sulle chiamate Supabase ──────
  window.fetch = function(input, init){
    try{
      var url = (typeof input === 'string') ? input : (input && input.url) || '';
      if(url.indexOf(SB_URL) === 0 && url.indexOf('/auth/v1/') < 0){
        var s = getSess();
        if(s && s.access_token){
          var h = new Headers((init && init.headers) || (typeof input!=='string' && input.headers) || {});
          h.set('apikey', SB_ANON);
          h.set('Authorization', 'Bearer ' + s.access_token);
          init = Object.assign({}, init, { headers: h });
          if(typeof input !== 'string') input = input.url;
        }
      }
    }catch(e){}
    return _fetch(input, init);
  };

  // ── chiamate auth diritte (niente librerie) ──────────────────────────────
  function login(email, password){
    return _fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SB_ANON },
      body: JSON.stringify({ email: email, password: password })
    }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); });
  }
  function refresh(rt){
    return _fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SB_ANON },
      body: JSON.stringify({ refresh_token: rt })
    }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, j:j }; }); });
  }
  function recover(email){
    return _fetch(SB_URL + '/auth/v1/recover?redirect_to=' + encodeURIComponent(RESET_URL), {
      method:'POST', headers:{ 'Content-Type':'application/json', 'apikey':SB_ANON },
      body: JSON.stringify({ email: email })
    }).then(function(r){ return { ok:r.ok }; });
  }

  // ── overlay di login ─────────────────────────────────────────────────────
  function css(){
    if(document.getElementById('l81-css')) return;
    var st=document.createElement('style'); st.id='l81-css';
    st.textContent = ''+
    '#l81{position:fixed;inset:0;z-index:2147483000;background:linear-gradient(135deg,#0e3a49,#0e6b64);'+
      'display:flex;align-items:center;justify-content:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:20px}'+
    '#l81 .box{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}'+
    '#l81 .ey{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c69a3e;font-weight:700}'+
    '#l81 h2{margin:6px 0 2px;color:#152238;font-size:20px}'+
    '#l81 .sub{color:#5a6272;font-size:13px;margin-bottom:18px}'+
    '#l81 input{width:100%;padding:13px;border:1px solid #d4dae0;border-radius:9px;font-size:16px;margin-bottom:10px;text-align:center}'+
    '#l81 input:focus{outline:2px solid #0e6b64;border-color:#0e6b64}'+
    '#l81 .pin{letter-spacing:.4em;font-weight:700}'+
    '#l81 button{width:100%;padding:13px;border:none;border-radius:9px;background:#0e6b64;color:#fff;font-size:16px;font-weight:700;cursor:pointer}'+
    '#l81 button:active{background:#0b544f}'+
    '#l81 .err{color:#a63b3b;font-size:13px;min-height:18px;margin-top:8px}';
    document.head.appendChild(st);
  }
  function overlay(){
    css();
    var wrap=document.createElement('div'); wrap.id='l81';
    var isPin = (MODE==='pin');
    wrap.innerHTML =
      '<div class="box">'+
        '<div class="ey">Ottantunocento S.r.l.</div>'+
        '<h2>'+APP+'</h2>'+
        '<div class="sub">'+(isPin?'Inserisci il PIN per accedere':'Accedi con email e password')+'</div>'+
        (isPin
          ? '<input id="l81pin" class="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••" maxlength="12">'
          : '<input id="l81em" type="email" placeholder="email" autocomplete="username">'+
            '<input id="l81pw" type="password" placeholder="password" autocomplete="current-password">')+
        '<button id="l81go">Entra</button>'+
        '<div class="err" id="l81err"></div>'+
        (isPin?'':'<div id="l81fg" style="margin-top:14px;font-size:13px"><a href="#" id="l81fga" style="color:#0e6b64;font-weight:600;text-decoration:underline">Password dimenticata?</a></div>')+
      '</div>';
    document.body.appendChild(wrap);
    var go=document.getElementById('l81go'), err=document.getElementById('l81err');
    function fail(m){ err.textContent = m || 'Accesso non riuscito'; go.disabled=false; go.textContent='Entra'; }
    function attempt(){
      err.textContent=''; go.disabled=true; go.textContent='Attendo…';
      var email, pw;
      if(isPin){ pw = (document.getElementById('l81pin').value||'').trim(); email = PIN_EMAIL;
        if(!pw){ return fail('Inserisci il PIN'); } }
      else { email=(document.getElementById('l81em').value||'').trim(); pw=document.getElementById('l81pw').value||'';
        if(!email||!pw){ return fail('Inserisci email e password'); } }
      login(email, pw).then(function(res){
        if(res.ok && res.j.access_token){ salva(res.j); location.reload(); }
        else { fail(isPin ? 'PIN errato' : (res.j.error_description || 'Email o password errati')); }
      }).catch(function(){ fail('Errore di rete, riprova'); });
    }
    go.addEventListener('click', attempt);
    var fga=document.getElementById('l81fga');
    if(fga) fga.addEventListener('click', function(ev){
      ev.preventDefault();
      var em=(document.getElementById('l81em').value||'').trim();
      if(!em){ err.textContent='Scrivi prima la tua email qui sopra, poi tocca "Password dimenticata?".'; return; }
      var emSafe=em.replace(/[<>&]/g,''); err.textContent=''; fga.textContent='Invio…';
      recover(em).then(function(){
        document.querySelector('#l81 .box').innerHTML=
          '<div class="ey">Ottantunocento S.r.l.</div>'+
          '<h2>Controlla l\'email</h2>'+
          '<div class="sub">Se <b>'+emSafe+'</b> è un account valido, ti abbiamo inviato un link per reimpostare la password. Aprila e segui il link (guarda anche nello spam).</div>'+
          '<button onclick="location.reload()">Torna al login</button>';
      }).catch(function(){ err.textContent='Invio non riuscito, riprova tra poco.'; fga.textContent='Password dimenticata?'; });
    });
    wrap.addEventListener('keydown', function(e){ if(e.key==='Enter') attempt(); });
    var first=document.getElementById(isPin?'l81pin':'l81em'); if(first) first.focus();
  }

  // ── tasto Esci (compare quando loggato) ──────────────────────────────────
  function addLogout(){
    function ins(){
      if(document.getElementById('l81out')) return;
      var b=document.createElement('button'); b.id='l81out'; b.type='button';
      b.textContent='🔒 Esci';
      b.setAttribute('style','position:fixed;bottom:calc(env(safe-area-inset-bottom) + 70px);left:12px;z-index:2147482000;'+
        'background:rgba(21,34,56,.85);color:#fff;border:none;border-radius:20px;'+
        'padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;'+
        'font-family:-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3)');
      b.addEventListener('click', function(){
        if(document.getElementById('l81cf')) return;
        var m=document.createElement('div'); m.id='l81cf';
        m.setAttribute('style','position:fixed;inset:0;z-index:2147483600;background:rgba(10,22,40,.6);display:flex;align-items:center;justify-content:center;font-family:-apple-system,Segoe UI,Roboto,sans-serif;padding:20px');
        m.innerHTML='<div style="background:#fff;border-radius:14px;padding:22px;max-width:300px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)">'+
          '<div style="font-size:16px;font-weight:700;color:#152238;margin-bottom:6px">Uscire dall\'app?</div>'+
          '<div style="font-size:13px;color:#5a6272;margin-bottom:16px">Dovrai reinserire email e password al prossimo accesso.</div>'+
          '<button id="l81cfy" style="width:100%;padding:12px;border:none;border-radius:9px;background:#a63b3b;color:#fff;font-weight:700;font-size:15px;cursor:pointer;margin-bottom:8px">🔒 Esci</button>'+
          '<button id="l81cfn" style="width:100%;padding:12px;border:1px solid #dcd6c8;border-radius:9px;background:#fff;color:#152238;font-weight:600;font-size:15px;cursor:pointer">Annulla</button>'+
          '</div>';
        document.body.appendChild(m);
        document.getElementById('l81cfy').addEventListener('click', function(){ window.logout81(); });
        document.getElementById('l81cfn').addEventListener('click', function(){ m.remove(); });
      });
      document.body.appendChild(b);
    }
    if(document.body) ins(); else document.addEventListener('DOMContentLoaded', ins);
  }

  // ── avvio: sessione valida? refresh? altrimenti login ────────────────────
  function mostra(){ if(document.body) overlay(); else document.addEventListener('DOMContentLoaded', overlay); }
  var s=getSess();
  if(valida(s)){ addLogout(); return; }
  if(s && s.refresh_token){
    refresh(s.refresh_token).then(function(res){
      if(res.ok && res.j.access_token){ salva(res.j); location.reload(); }
      else { setSess(null); mostra(); }
    }).catch(function(){ mostra(); });
  } else { mostra(); }

  window.logout81 = function(){
    try{ window.localStorage.removeItem(LSK); }catch(e){}
    try{ window.sessionStorage.removeItem(LSK); }catch(e){}
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
    location.reload();
  };
})();
</script>

<body>
<div id="app-root"></div>
<div id="toast"></div>
<div id="sheet-host"></div>

<script>
/* =====================================================================
   81|00 Risorse & Depositi — master del parco attrezzature
   Tabelle: risorse, allocazioni (movimenti), ubicazioni, depositi, categorie
   ===================================================================== */
"use strict";
const SB_URL = 'https://xqbhujcnjvwbwzpwjujf.supabase.co';
const REST = SB_URL + '/rest/v1/';

/* ---------- stato ---------- */
const S = { cat:[], ubi:[], dep:[], ris:[], mov:[], cantieri:[], loaded:false };
let TAB = 'dash';
let PARCO_FILTRO = 'tutti';   // tutti | quantita | univoca | consumabile
let PARCO_Q = '';

/* ---------- helper ---------- */
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>Array.from(r.querySelectorAll(s));
const esc = s => (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,7);
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtD(iso){ if(!iso) return '—'; const p=String(iso).slice(0,10).split('-'); return p.length===3? p[2]+'/'+p[1]+'/'+p[0].slice(2) : iso; }
function fmtDlong(iso){ if(!iso) return '—'; const p=String(iso).slice(0,10).split('-'); return p.length===3? p[2]+'/'+p[1]+'/'+p[0] : iso; }
function euro(n){ n=Number(n)||0; return '€ ' + n.toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function num(n){ n=Number(n)||0; return n.toLocaleString('it-IT',{maximumFractionDigits:2}); }
function toast(msg,ms=2200){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),ms); }

/* ---------- API ---------- */
async function apiGet(path){
  const r = await fetch(REST+path, {headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('GET '+path+' → '+r.status+' '+(await r.text()));
  return r.json();
}
async function apiSend(method, path, body){
  const r = await fetch(REST+path, {
    method,
    headers:{'Content-Type':'application/json','Prefer':'return=representation'},
    body: body!=null ? JSON.stringify(body) : undefined
  });
  if(!r.ok) throw new Error(method+' '+path+' → '+r.status+' '+(await r.text()));
  const txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

/* ---------- caricamento dati ---------- */
async function loadAll(){
  const [cat,ubi,dep,ris,mov] = await Promise.all([
    apiGet('categorie?select=*&order=ordine.asc'),
    apiGet('ubicazioni?select=*&order=tipo.asc,nome.asc'),
    apiGet('depositi?select=*&order=nome.asc'),
    apiGet('risorse?select=*'),
    apiGet('allocazioni?select=*&order=data_uscita.desc')
  ]);
  S.cat=cat; S.ubi=ubi; S.dep=dep; S.ris=ris; S.mov=mov;
  // cantieri dal blob del gestionale (solo lettura)
  try{
    const g = await apiGet('gestionale_dati?select=dati&limit=1');
    const dati = g && g[0] && g[0].dati || {};
    const arch = new Set(dati._cantieriArchiviati||[]);
    S.cantieri = (dati.cantieri||[]).map(c=>({id:c.id, nome:c.nome||c.name||c.cantiere||'(senza nome)', stato:c.stato, tipo:c.tipo, arch:arch.has(c.id)}));
  }catch(e){ S.cantieri=[]; console.warn('cantieri non caricati', e); }
  // Normalizza i movimenti scritti da app che non compilano a_/da_ (es. Planning):
  // ricava destinazione e provenienza dai campi storici cantiere_id/deposito_id.
  S.mov.forEach(m=>{
    if(!m.a_tipo){ if(m.cantiere_id){ m.a_tipo='cantiere'; m.a_id=m.a_id||m.cantiere_id; m.a_nome=m.a_nome||m.cantiere_nome; }
      else { m.a_tipo='deposito'; m.a_id=m.a_id||m.deposito_id; m.a_nome=m.a_nome||depNome(m.deposito_id); } }
    if(!m.da_tipo){ m.da_tipo='deposito'; m.da_id=m.da_id||m.deposito_id; m.da_nome=m.da_nome||depNome(m.deposito_id); }
  });
  S.loaded=true;
}

/* ---------- indici e calcoli ---------- */
function catById(id){ return S.cat.find(c=>c.id===id); }
function catLabel(r){ const c=catById(r.categoria_id); if(c) return (c.icona? c.icona+' ':'')+c.nome; return r.categoria||'Altro'; }
function catIcona(r){ const c=catById(r.categoria_id); return c&&c.icona ? c.icona : '📦'; }
function risById(id){ return S.ris.find(r=>r.id===id); }
function movDi(rid){ return S.mov.filter(m=>m.risorsa_id===rid); }
function isAperto(m){ return !['rientrata','trasferita','annullata'].includes(m.stato) && !m.data_rientro_effettiva; }
function isFuori(m){ return m.a_tipo && m.a_tipo!=='deposito'; }   // destinazione non-deposito = fuori
// movimenti attivi OGGI (già usciti, non ancora rientrati) e fuori dal deposito
function movFuoriOggi(rid, t){ t=t||todayISO();
  return movDi(rid).filter(m=> isAperto(m) && isFuori(m) && m.data_uscita<=t && (!m.data_rientro || m.data_rientro>=t) );
}
function qtyFuoriOggi(rid,t){ return movFuoriOggi(rid,t).reduce((s,m)=>s+(Number(m.qty)||0),0); }
// posizione attuale: array {luogo, tipo, qty}
function posizione(r, t){ t=t||todayISO();
  const fuori = movFuoriOggi(r.id,t);
  const map = {};
  fuori.forEach(m=>{ const k=m.a_nome||'?'; if(!map[k]) map[k]={luogo:k,tipo:m.a_tipo,qty:0}; map[k].qty+=Number(m.qty)||0; });
  const arr = Object.values(map);
  const inDep = (Number(r.qty_totale)||0) - qtyFuoriOggi(r.id,t);
  if(inDep>0.0001 || arr.length===0){
    const dn = depNome(r.deposito_base) || 'Deposito';
    arr.unshift({luogo:dn, tipo:'deposito', qty: r.gestione==='univoca'? (arr.length? 0 : 1) : inDep});
  }
  return arr.filter(x=>x.qty>0.0001);
}
// rientri in ritardo (previsto < oggi, non rientrato)
function movInRitardo(){ const t=todayISO();
  return S.mov.filter(m=> isAperto(m) && isFuori(m) && m.data_rientro && m.data_rientro<t );
}
function movProgrammati(){ const t=todayISO();
  return S.mov.filter(m=> isAperto(m) && isFuori(m) && m.data_uscita>t );
}
function movFuoriTuttiOggi(){ const t=todayISO();
  return S.mov.filter(m=> isAperto(m) && isFuori(m) && m.data_uscita<=t && (!m.data_rientro||m.data_rientro>=t) );
}
function depNome(id){ const d=S.dep.find(x=>x.id===id); if(d) return d.nome; const u=S.ubi.find(x=>x.id===id); return u? u.nome : id; }
// disponibilità in un periodo [d1,d2]
function disponibilita(r, d1, d2){
  const tot = Number(r.qty_totale)||0;
  let impegnata = 0;
  movDi(r.id).forEach(m=>{
    if(!isAperto(m) || !isFuori(m)) return;
    const a=m.data_uscita, b=m.data_rientro||'9999-12-31';
    if(a<=d2 && b>=d1) impegnata += Number(m.qty)||0;   // sovrapposizione
  });
  return tot - impegnata;
}
function valoreParco(){
  return S.ris.reduce((s,r)=> s + (Number(r.valore)||0) * (r.gestione==='univoca'? 1 : (Number(r.qty_totale)||0) ), 0);
}

/* =====================================================================
   RENDER — shell
   ===================================================================== */
const NAV = [
  {id:'dash',  ic:'📊', lb:'Panoramica'},
  {id:'parco', ic:'📦', lb:'Parco'},
  {id:'mov',   ic:'↔️', lb:'Movimenti'},
  {id:'dep',   ic:'🏬', lb:'Depositi'}
];
function shell(){
  const root=$('#app-root');
  root.innerHTML = `
    <header id="hdr">
      <div class="brand"><span class="logo">81|00</span><span class="sub">Risorse &amp; Depositi</span></div>
      <button id="btn-sync" class="sync" aria-label="Aggiorna">↻</button>
    </header>
    <main id="content"></main>
    <nav id="nav">${NAV.map(n=>`<button class="nb ${n.id===TAB?'on':''}" data-tab="${n.id}"><span class="ni">${n.ic}</span>${n.lb}</button>`).join('')}</nav>`;
  $('#btn-sync').addEventListener('click', reload);
  $$('#nav .nb').forEach(b=> b.addEventListener('click', ()=>{ TAB=b.dataset.tab; render(); }));
}
async function reload(){ const b=$('#btn-sync'); if(b){b.classList.add('spin');} try{ await loadAll(); render(); toast('Aggiornato ✓'); }catch(e){ toast('Errore aggiornamento'); console.error(e);} finally{ if(b) b.classList.remove('spin'); } }
function render(){
  $$('#nav .nb').forEach(b=> b.classList.toggle('on', b.dataset.tab===TAB));
  const c=$('#content'); if(!c) return;
  if(TAB==='dash') c.innerHTML = viewDash();
  else if(TAB==='parco'){ c.innerHTML = viewParco(); wireParco(); }
  else if(TAB==='mov') c.innerHTML = viewMov();
  else if(TAB==='dep') c.innerHTML = viewDep();
  c.scrollTop=0;
}

/* =====================================================================
   VIEW — Panoramica
   ===================================================================== */
function viewDash(){
  const nRis=S.ris.length;
  const nUniv=S.ris.filter(r=>r.gestione==='univoca').length;
  const fuori=movFuoriTuttiOggi();
  const ritardo=movInRitardo();
  const prog=movProgrammati();
  const val=valoreParco();
  // rientri previsti nei prossimi 7 gg
  const t=todayISO(); const d7=new Date(); d7.setDate(d7.getDate()+7); const t7=d7.toISOString().slice(0,10);
  const rientri7=fuori.filter(m=>m.data_rientro && m.data_rientro>=t && m.data_rientro<=t7);

  let html = `<div class="pg">
    <div class="kpis">
      <div class="kpi"><div class="kn">${nRis}</div><div class="kl">Risorse</div><div class="ks">${nUniv} attrezzi</div></div>
      <div class="kpi"><div class="kn">${fuori.length}</div><div class="kl">Fuori adesso</div><div class="ks">in cantiere / su mezzo</div></div>
      <div class="kpi ${ritardo.length?'warn':''}"><div class="kn">${ritardo.length}</div><div class="kl">Rientri scaduti</div><div class="ks">${ritardo.length?'da controllare':'tutto ok'}</div></div>
      <div class="kpi"><div class="kn" style="font-size:19px">${euro(val)}</div><div class="kl">Valore parco</div><div class="ks">${prog.length} usc. programmate</div></div>
    </div>`;

  if(ritardo.length){
    html += `<div class="sec-lbl warn-lbl">⚠️ Rientri scaduti</div><div class="list">`;
    ritardo.sort((a,b)=>(a.data_rientro||'').localeCompare(b.data_rientro||'')).forEach(m=>{
      const r=risById(m.risorsa_id);
      html += rowMov(m, r, true);
    });
    html += `</div>`;
  }

  html += `<div class="sec-lbl">🚚 Fuori adesso</div>`;
  if(!fuori.length){ html += `<div class="empty">Tutto in deposito. Niente materiale fuori.</div>`; }
  else {
    // raggruppa per luogo
    const byLuogo={};
    fuori.forEach(m=>{ const k=m.a_nome||'?'; (byLuogo[k]=byLuogo[k]||[]).push(m); });
    html += `<div class="list">`;
    Object.keys(byLuogo).sort().forEach(luogo=>{
      const items=byLuogo[luogo];
      html += `<div class="grp"><div class="grp-h">${items[0].a_tipo==='mezzo'?'🚐':'🏗️'} ${esc(luogo)} <span class="badge">${items.length}</span></div>`;
      items.forEach(m=> html += rowMov(m, risById(m.risorsa_id), false, true));
      html += `</div>`;
    });
    html += `</div>`;
  }

  if(rientri7.length){
    html += `<div class="sec-lbl">📅 Rientri previsti (7 giorni)</div><div class="list">`;
    rientri7.sort((a,b)=>(a.data_rientro||'').localeCompare(b.data_rientro||'')).forEach(m=>{
      html += rowMov(m, risById(m.risorsa_id), false);
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}
function rowMov(m, r, ritardo, hideLuogo){
  const nome = r? r.nome : ('#'+m.risorsa_id);
  const q = (Number(m.qty)||0);
  const luogo = hideLuogo? '' : `<span class="mr-luogo">${m.a_tipo==='mezzo'?'🚐':'🏗️'} ${esc(m.a_nome||'')}</span>`;
  return `<div class="row" onclick="apriRisorsa('${esc(m.risorsa_id)}')">
    <div class="row-main"><div class="row-t">${esc(nome)}</div>
      <div class="row-s">${q} ${esc(r?r.unita:'pz')} · uscita ${fmtD(m.data_uscita)} ${luogo}</div></div>
    <div class="row-r">${ritardo
      ? `<span class="pill red">rientro ${fmtD(m.data_rientro)}</span>`
      : (m.data_rientro? `<span class="pill">↩ ${fmtD(m.data_rientro)}</span>`:`<span class="pill amber">aperto</span>`)}
      <button class="mini" onclick="event.stopPropagation();rientroRapido(${m.id})">Rientro</button></div>
  </div>`;
}

function viewParco(){
  const filtri=[['tutti','Tutti'],['quantita','A quantità'],['univoca','Attrezzi'],['consumabile','Consumabili']];
  let list = S.ris.slice();
  if(PARCO_FILTRO!=='tutti') list=list.filter(r=>r.gestione===PARCO_FILTRO);
  if(PARCO_Q){ const q=PARCO_Q.toLowerCase(); list=list.filter(r=>(r.nome||'').toLowerCase().includes(q) || (catLabel(r)||'').toLowerCase().includes(q)); }
  // raggruppa per categoria
  const groups={};
  list.forEach(r=>{ const k=r.categoria_id||'altro'; (groups[k]=groups[k]||[]).push(r); });
  const order=S.cat.map(c=>c.id).concat(['altro']);
  const keys=Object.keys(groups).sort((a,b)=>{ const ia=order.indexOf(a), ib=order.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });

  let html=`<div class="pg">
    <div class="toolbar">
      <input id="parco-q" class="search" type="search" placeholder="Cerca risorsa…" value="${esc(PARCO_Q)}">
      <button class="add" onclick="nuovaRisorsa()">＋ Risorsa</button>

  if(!list.length){ html+=`<div class="empty">Nessuna risorsa con questi filtri.</div>`; }
  keys.forEach(k=>{
    const c=catById(k);
    const rs=groups[k].sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
    html+=`<div class="sec-lbl">${c?(c.icona+' '+c.nome):'📦 Altro'} <span class="cnt">${rs.length}</span></div><div class="list">`;
    rs.forEach(r=>{
      const pos=posizione(r);
      const dove = pos.map(p=>`${p.qty>1||r.gestione!=='univoca'?num(p.qty)+' ':''}${p.tipo==='deposito'?'🏠':(p.tipo==='mezzo'?'🚐':'🏗️')} ${esc(p.luogo)}`).join(' · ');
      const badge = r.gestione==='univoca'?'<span class="tag">attrezzo</span>':(r.gestione==='consumabile'?'<span class="tag grey">consumabile</span>':'');
      html+=`<div class="row" onclick="apriRisorsa('${esc(r.id)}')">
        <div class="row-main"><div class="row-t">${esc(r.nome)} ${badge}</div>
          <div class="row-s">${r.gestione==='univoca'?'':'tot '+num(r.qty_totale)+' '+esc(r.unita)+' · '}${dove||'—'}</div></div>
        <div class="row-r"><span class="chev">›</span></div>
      </div>`;
    });
    html+=`</div>`;
  });
  html+=`</div>`;
  return html;
}
function wireParco(){
  $$('.chip').forEach(b=> b.addEventListener('click', ()=>{ PARCO_FILTRO=b.dataset.f; render(); }));
  const q=$('#parco-q'); if(q){ q.addEventListener('input', e=>{ PARCO_Q=e.target.value; const pos=q.selectionStart; render(); const nq=$('#parco-q'); if(nq){ nq.focus(); try{nq.setSelectionRange(pos,pos);}catch(_){} } }); }
}

    <div class="frow">
      ${fld('Matricola', `<input name="matricola" value="${esc(r.matricola||'')}">`)}
      ${fld('Valore (€)', `<input name="valore" type="number" step="0.01" inputmode="decimal" value="${r.valore!=null?r.valore:''}">`)}
    </div>
    <div class="frow">
      ${fld('Marca', `<input name="marca" value="${esc(r.marca||'')}">`)}
      ${fld('Custode', `<input name="custode" value="${esc(r.custode||'')}">`)}
    </div>
    ${fld('Note', `<textarea name="note" rows="2">${esc(r.note||'')}</textarea>`)}
    <div class="sh-actions">
      <button type="submit" class="save">${isNew?'Crea risorsa':'Salva'}</button>
      ${isNew?'':`<button type="button" class="del" onclick="eliminaRisorsa('${esc(r.id)}')">Elimina</button>`}
    </div></form>`;
  openSheet(isNew?'Nuova risorsa':'Modifica risorsa', body);

async function eliminaRisorsa(id){
  if(movDi(id).length){ if(!confirm('Questa risorsa ha movimenti registrati. Preferisci disattivarla invece di eliminarla.\n\nEliminare comunque?')) return; }

  try{ await apiSend('DELETE','risorse?id=eq.'+encodeURIComponent(id)); await loadAll(); closeSheet(); render(); toast('Eliminata'); }
  catch(e){ console.error(e); toast('Errore: potrebbe avere movimenti collegati'); }
}

/* ---------- movimento: uscita / trasferimento / rientro ---------- */
// Cantieri ordinati "attivi prima" (operativi -> lungo periodo -> conclusi/persi),
// esclusi gli archiviati. Riduce la sfilza nel menu Destinazione.
function _cantieriOrdinati(){
  const isConcl=c=>{const s=(c.stato||'').toLowerCase();return s.includes('conclus')||s.includes('pers');};
  const rank=c=>isConcl(c)?2:(c.tipo==='lungo_periodo'?1:0);
  return S.cantieri.filter(c=>!c.arch)
    .slice().sort((a,b)=>rank(a)-rank(b)||(a.nome||'').localeCompare(b.nome||''));
}
function destOptions(){
  // cantieri dal blob + depositi + mezzi + esterni
  const groups=[];
  const cant=_cantieriOrdinati();
  if(cant.length) groups.push(['Cantieri', cant.map(c=>({v:'cantiere|'+c.id+'|'+c.nome, l:c.nome}))]);
  groups.push(['Depositi', S.dep.map(d=>({v:'deposito|'+d.id+'|'+d.nome, l:d.nome}))]);
  groups.push(['Mezzi', S.ubi.filter(u=>u.tipo==='mezzo').map(u=>({v:'mezzo|'+(u.rif_id||u.id)+'|'+u.nome, l:u.nome}))]);
  groups.push(['Esterno', S.ubi.filter(u=>u.tipo==='esterno').map(u=>({v:'esterno|'+(u.rif_id||u.id)+'|'+u.nome, l:u.nome}))]);
  return groups.map(g=>`<optgroup label="${g[0]}">${g[1].map(o=>`<option value="${esc(o.v)}">${esc(o.l)}</option>`).join('')}</optgroup>`).join('');
}
function nuovoMovimento(tipo, preRis){
  tipo=tipo||'uscita';
  if(tipo==='rientro') return formRientro();
  const risOpts=S.ris.filter(r=>r.gestione!=='consumabile').sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  const titolo = tipo==='trasferimento'?'Trasferimento':'Uscita dal deposito';
  const body=`<form id="frm-mov">
    ${fld('Risorsa', `<select name="ris" required>${risOpts.map(r=>`<option value="${esc(r.id)}" ${r.id===preRis?'selected':''}>${esc(r.nome)}${r.gestione==='univoca'?' · attrezzo':''}</option>`).join('')}</select>`)}
    ${fld('Quantità', `<input name="qty" type="number" step="1" min="1" inputmode="numeric" value="1" required>`)}
    <div id="disp-hint" class="hint"></div>
    ${tipo==='trasferimento'?fld('Da (dove si trova ora)', `<select name="da" required>${destOptions()}</select>`):''}
    ${fld('Destinazione', `<select name="dest" required>${destOptions()}</select>`)}
    <div class="frow">
      ${fld('Data uscita', `<input name="d1" type="date" value="${todayISO()}" required>`)}
      ${fld('Rientro previsto', `<input name="d2" type="date">`)}
    </div>
    ${fld('Note', `<input name="note" placeholder="opzionale">`)}
    <div class="sh-actions"><button type="submit" class="save">Registra ${tipo==='trasferimento'?'trasferimento':'uscita'}</button></div>
  </form>`;
  openSheet(titolo, body);
  const f=$('#frm-mov');
  function checkDisp(){
    const r=risById(f.elements['ris'].value); if(!r){ $('#disp-hint').textContent=''; return; }
    const d1=f.elements['d1'].value, d2=f.elements['d2'].value||d1;
    if(r.gestione==='univoca'){ $('#disp-hint').innerHTML=''; return; }
    const disp=disponibilita(r,d1,d2); const q=Number(f.elements['qty'].value)||0;
    const el=$('#disp-hint');
    if(q>disp){ el.className='hint bad'; el.textContent=`⚠️ Disponibili solo ${num(disp)} ${r.unita} in questo periodo (richiesti ${q}).`; }
    else{ el.className='hint ok'; el.textContent=`Disponibili ${num(disp)} ${r.unita} in questo periodo.`; }
  }
  ['ris','qty','d1','d2'].forEach(n=> f.elements[n]&&f.elements[n].addEventListener('input',checkDisp));
  checkDisp();
  f.addEventListener('submit', async ev=>{
    ev.preventDefault();
    const r=risById(f.elements['ris'].value); if(!r) return;
    const dp=(f.elements['dest'].value||'').split('|'); const aTipo=dp[0], aId=dp[1], aNome=dp.slice(2).join('|');
    let daTipo='deposito', daId=r.deposito_base, daNome=depNome(r.deposito_base);
    if(tipo==='trasferimento'){ const p=(f.elements['da'].value||'').split('|'); daTipo=p[0]; daId=p[1]; daNome=p.slice(2).join('|'); }
    const d1=f.elements['d1'].value, d2=f.elements['d2'].value||null;
    const stato = d1>todayISO() ? 'programmata' : 'in_corso';
    const row={
      risorsa_id:r.id, qty:Number(f.elements['qty'].value)||1,
      deposito_id: r.deposito_base||null,
      cantiere_id: aTipo==='cantiere'?aId:null, cantiere_nome: aTipo==='cantiere'?aNome:null,
      data_uscita:d1, data_rientro:d2, stato,
      da_tipo:daTipo, da_id:daId, da_nome:daNome, a_tipo:aTipo, a_id:aId, a_nome:aNome,
      origine:'app_risorse', note:f.elements['note'].value.trim()||null
    };
    try{
      // Trasferimento da una posizione NON-deposito: storna le allocazioni aperte
      // che si trovano su "da" (FIFO), così la risorsa non risulta in due posti.
      // Stessa semantica del Planning (movTrasferimento → stato 'trasferita').
      if(tipo==='trasferimento' && daTipo!=='deposito'){
        let resto=row.qty;
        const fonti=movDi(r.id)
          .filter(m=> isAperto(m) && isFuori(m) && (m.a_id===daId || m.a_nome===daNome))
          .sort((a,b)=>(a.data_uscita||'').localeCompare(b.data_uscita||''));
        for(const m of fonti){
          if(resto<=0) break;
          const mq=Number(m.qty)||0;
          if(mq<=resto){ await apiSend('PATCH','allocazioni?id=eq.'+m.id,{stato:'trasferita', data_rientro:d1, data_rientro_effettiva:d1}); resto-=mq; }
          else { await apiSend('PATCH','allocazioni?id=eq.'+m.id,{qty:mq-resto}); resto=0; }
        }
      }
      await apiSend('POST','allocazioni',[row]); await loadAll(); closeSheet(); render(); toast('Movimento registrato ✓');
    }
    catch(e){ console.error(e); toast('Errore registrazione'); }
  });
}
function formRientro(){
  const aperti=movFuoriTuttiOggi().concat(movInRitardo()).filter((m,i,a)=>a.indexOf(m)===i);
  if(!aperti.length){ openSheet('Rientro', `<div class="empty">Nessun movimento aperto da far rientrare.</div>`); return; }
  const body=`<form id="frm-in">
    ${fld('Movimento da chiudere', `<select name="mov" required>${aperti.sort((a,b)=>(a.data_rientro||'').localeCompare(b.data_rientro||'')).map(m=>{const r=risById(m.risorsa_id);return `<option value="${m.id}">${esc(r?r.nome:'?')} · ${num(m.qty)} · ${esc(m.a_nome||'')}</option>`;}).join('')}</select>`)}
    ${fld('Data rientro effettivo', `<input name="dr" type="date" value="${todayISO()}" required>`)}
    ${fld('Rientra in', `<select name="dove">${S.dep.map(d=>`<option value="${d.id}|${esc(d.nome)}">${esc(d.nome)}</option>`).join('')}</select>`)}
    <div class="sh-actions"><button type="submit" class="save">Registra rientro</button></div></form>`;
  openSheet('Rientro in deposito', body);
  $('#frm-in').addEventListener('submit', async ev=>{
    ev.preventDefault(); const f=ev.target;
    const id=f.elements['mov'].value; const dr=f.elements['dr'].value;
    try{ await apiSend('PATCH','allocazioni?id=eq.'+id, {data_rientro_effettiva:dr, data_rientro: dr, stato:'rientrata'}); await loadAll(); closeSheet(); render(); toast('Rientro registrato ✓'); }
    catch(e){ console.error(e); toast('Errore rientro'); }
  });
}
async function rientroRapido(id){
  const m=S.mov.find(x=>x.id===id); if(!m) return;
  const r=risById(m.risorsa_id);
  if(!confirm(`Registrare il rientro di "${r?r.nome:'?'}" (${num(m.qty)}) oggi?`)) return;
  try{ await apiSend('PATCH','allocazioni?id=eq.'+id, {data_rientro_effettiva:todayISO(), data_rientro:todayISO(), stato:'rientrata'}); await loadAll(); render(); const h=$('#sheet-host'); if(h&&h.innerHTML) apriRisorsa(m.risorsa_id); toast('Rientro registrato ✓'); }
  catch(e){ console.error(e); toast('Errore rientro'); }
}
window.nuovoMovimento=nuovoMovimento; window.rientroRapido=rientroRapido;

/* ---------- depositi / ubicazioni ---------- */
function nuovoDeposito(){
  const body=`<form id="frm-dep">${fld('Nome deposito',`<input name="nome" required>`)}${fld('Note',`<input name="note">`)}
    <div class="sh-actions"><button type="submit" class="save">Crea deposito</button></div></form>`;
  openSheet('Nuovo deposito', body);
  $('#frm-dep').addEventListener('submit', async ev=>{ ev.preventDefault(); const f=ev.target;
    const id='dep_'+uid(); const nome=f.elements['nome'].value.trim();
    try{ await apiSend('POST','depositi',[{id,nome,tipo:'deposito',note:f.elements['note'].value.trim()||null}]);
      await apiSend('POST','ubicazioni',[{id,nome,tipo:'deposito',rif_id:id}]);
      await loadAll(); closeSheet(); render(); toast('Deposito creato ✓'); }
    catch(e){ console.error(e); toast('Errore'); } });
}
function nuovoMezzo(){
  const body=`<form id="frm-mz">${fld('Nome / targa',`<input name="nome" required placeholder="es. GB649YN">`)}
    ${fld('Tipo',`<select name="tipo"><option value="mezzo">Mezzo</option><option value="esterno">Esterno / terzi</option></select>`)}
    <div class="sh-actions"><button type="submit" class="save">Aggiungi</button></div></form>`;
  openSheet('Nuova ubicazione', body);
  $('#frm-mz').addEventListener('submit', async ev=>{ ev.preventDefault(); const f=ev.target;
    const nome=f.elements['nome'].value.trim(); const tipo=f.elements['tipo'].value;
    const id=tipo+'_'+nome.replace(/[^A-Za-z0-9]/g,'')||tipo+'_'+uid();
    try{ await apiSend('POST','ubicazioni',[{id,nome,tipo,rif_id:nome}]); await loadAll(); closeSheet(); render(); toast('Aggiunto ✓'); }
    catch(e){ console.error(e); toast('Errore'); } });
}
window.nuovoDeposito=nuovoDeposito; window.nuovoMezzo=nuovoMezzo;

/* ---------- stop autofill contatti del telefono (rubrica) ---------- */
// I form nascono dinamicamente nelle sheet: un MutationObserver spegne
// l'autofill su ogni campo di testo appena compare (nome risorsa, marca,
// custode, targa mezzo, ecc.), così la rubrica non copre i campi.
function _killAutofill(root){
  const NO=['date','time','number','checkbox','radio','file','range','color','password','hidden'];
  (root||document).querySelectorAll('input').forEach(el=>{
    if(el.dataset.afDone) return;
    const t=(el.getAttribute('type')||'text').toLowerCase();
    if(NO.includes(t)) return;
    el.setAttribute('autocomplete','off');
    el.setAttribute('autocorrect','off');
    el.setAttribute('spellcheck','false');
    el.dataset.afDone='1';
  });
}
function _startAutofillGuard(){
  _killAutofill(document);
  try{
    new MutationObserver(ms=>{
      for(const m of ms) for(const n of m.addedNodes){
        if(n.nodeType!==1) continue;
        if(n.matches&&n.matches('input')) _killAutofill(n.parentNode||document);
        else if(n.querySelector&&n.querySelector('input')) _killAutofill(n);
      }
    }).observe(document.body,{childList:true,subtree:true});
  }catch(e){}
}

/* =====================================================================
   INIT
   ===================================================================== */
async function init(){
  shell();
  _startAutofillGuard();
  $('#content').innerHTML = `<div class="loading"><div class="sp">⚙️</div><p>Carico il parco…</p></div>`;
  try{ await loadAll(); render(); }
  catch(e){ console.error(e); $('#content').innerHTML = `<div class="empty" style="margin-top:40px">Errore di caricamento.<br><small>${esc(String(e.message||e))}</small><br><br><button class="add" onclick="init()">Riprova</button></div>`; }
}
window.init=init;
if('serviceWorker' in navigator){ try{ navigator.serviceWorker.register('sw.js?v=1'); }catch(e){} }
if(getSess81()) init();
function getSess81(){ try{ const s=JSON.parse((localStorage.getItem('sb81_sess')||sessionStorage.getItem('sb81_sess'))||'null'); return s&&s.access_token; }catch(e){ return false; } }
